<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Language</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      background: #121212;
      color: #ffffff;
    }
    h1 {
      margin-bottom: 40px;
    }
    .btn {
      padding: 15px 30px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #1e1e1e;
      color: #ffffff;
      transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      background: #333333;
      transform: translateY(-3px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <h1>Please Select Your Language</h1>
  <button class="btn" onclick="redirectToLang('en')">English</button>
  <button class="btn" onclick="redirectToLang('zh')">中文</button>

<script>
  function redirectToLang(lang) {
    const basePath = window.location.pathname.replace(/\/$/, ''); // Remove trailing slash
    window.location.href = `${basePath}/${lang}/`;
  }
</script>
</body>
</html>
